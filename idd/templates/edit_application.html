{% extends 'homepage.html' %}
{% load static %}

{% block title %}Edit App{% endblock %}

{% block content %}
<div class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-3xl w-full bg-white rounded-lg shadow-lg p-10">
        
        <h1 class="text-3xl font-bold text-[#000B5B] mb-6">Edit Application</h1>
        <p class="text-sm text-gray-600 mb-8">
            Use the form below to edit the details of your application.
        </p>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="project" class="block text-sm font-medium text-gray-700 p-3">
                    Select Project <span class="text-[#FFE31A]">*</span>
                </label>
                <select id="project" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mb-3 focus:border-[#FFE31A]" name="project" required>
                    <option value="" disabled>Select a project</option>
                    {% for project in projects %}
                        <option value="{{ project.id }}" {% if project.id == application.project.id %}selected{% endif %}>{{ project.title }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="app_name" class="block text-sm font-medium text-gray-700">
                    App Name <span class="text-[#FFE31A]">*</span>
                </label>
                <input type="text" id="app_name" name="app_name" placeholder="Enter app name" required
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mb-3 focus:border-[#FFE31A]" 
                    value="{{ application.name }}">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700">
                    App Description
                </label>
                <textarea id="description" name="description" rows="5" placeholder="Write a short description..." 
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mb-3 focus:border-[#FFE31A]">{{ application.description }}</textarea>
            </div>

            <div>
                <button type="submit"
                    class="w-full bg-[#000B5B] text-white font-medium py-3 px-6 rounded-md hover:bg-[#002982] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#FFE31A]">
                    Update Application
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
