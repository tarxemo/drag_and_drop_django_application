{% extends 'base_template.html' %}

{% block content %}
<div class="mb-4">
    <h2 class="text-xl font-bold mb-4">All Attributes for {{ tag.name }}</h2>
    <table class="min-w-full bg-white">
        <thead>
            <tr>
                <th class="py-2 px-4 border-b">ID</th>
                <th class="py-2 px-4 border-b">Name</th>
                <th class="py-2 px-4 border-b">Value</th>
                <th class="py-2 px-4 border-b">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for attribute in attributes %}
            <tr>
                <td class="py-2 px-4 border-b">{{ attribute.id }}</td>
                <td class="py-2 px-4 border-b">{{ attribute.attribute_name }}</td>
                <td class="py-2 px-4 border-b">{{ attribute.attribute_value }}</td>
                <td class="py-2 px-4 border-b">
                    <a href="{% url 'edit_attribute' template.id %}?attribute_id={{ attribute.id }}" class="text-blue-500 hover:text-blue-700 mr-2">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a href="{% url 'delete_attribute' template.id %}?attribute_id={{ attribute.id }}" class="text-red-500 hover:text-red-700">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
