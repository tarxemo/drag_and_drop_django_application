{% extends 'base_template.html' %}

{% block content %}
<div class="mb-4">
    <h2 class="text-xl font-bold mb-4">All Classes for {{ tag.name }}</h2>
    <table class="min-w-full bg-white">
        <thead>
            <tr>
                <th class="py-2 px-4 border-b">Class Name</th>
                <th class="py-2 px-4 border-b">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for class in classes %}
            <tr>
                <td class="py-2 px-4 border-b">{{ class.class_name }}</td>
                <td class="py-2 px-4 border-b">
                    <a href="{% url 'edit_class' template.id %}?class_id={{ class.id }}" class="text-blue-500 hover:text-blue-700 mr-2">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a href="{% url 'delete_class' template.id %}?class_id={{ class.id }}" class="text-red-500 hover:text-red-700">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
