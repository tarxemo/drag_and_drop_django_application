{% extends "homepage.html"%}
    {% load static %}
   {%block title%}Template List{%endblock%}
   {% block content%}
    <div class="container mx-auto mt-5">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-3xl font-bold">Templates</h1>
            <a href="{% url 'add_template' %}" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                <i class="fas fa-plus"></i> Add New Template
            </a>
            <a href="{% url 'upload_html' %}" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                <i class="fas fa-plus"></i> Upload Template
            </a>
        </div>
        <div class="bg-white shadow-md rounded my-6">
            <table class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="w-1/3 py-3 px-4 uppercase font-semibold text-sm">Template Name</th>
                        <th class="w-1/3 py-3 px-4 uppercase font-semibold text-sm">Actions</th>
                    </tr>
                </thead>
                <tbody class="text-gray-700">
                    {% for template in templates %}
                        <tr>
                            <td class="w-auto text-center py-3 px-4">{{ template.name }}</td>
                            <td class="w-full py-3 px-4 flex justify-between">
                                <a href="{% url 'template_detail' template.id %}" class="text-blue-500 hover:text-blue-700">
                                    <i class="fas fa-edit"></i> Edit
                                </a>
                                <a href="{% url 'delete_template' template.id %}" class="text-red-500 hover:text-red-700 ml-4">
                                    <i class="fas fa-trash-alt"></i> Delete
                                </a>
                                <a href="{% url 'download_html' template.id %}" class="text-green-500 hover:text-green-700 ml-4">
                                    <i class="fas fa-download"></i> Download
                                </a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{%endblock%}
