<!-- retrieve_all_data.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrieve All Data</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
<div class="container mx-auto mt-5">
    <h1 class="text-2xl font-bold mb-4">Data for Table: {{ table_name }}</h1>
    <table class="table-auto w-full">
        <thead>
            <tr>
                {% for field_name in field_names %}
                <th class="px-4 py-2">{{ field_name }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for obj in objects %}
            <tr>
                {% for field_name in field_names %}
                <td class="border px-4 py-2">{{ obj|attr:field_name }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
