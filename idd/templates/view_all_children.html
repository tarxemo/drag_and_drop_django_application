{% extends 'base_template.html' %}

{% block content %}
<div class="mb-4">
    <h2 class="text-xl font-bold mb-4">All Children Tags for {{ tag.tag_name }}</h2>
    <table class="min-w-full bg-white">
        <thead>
            <tr>
                <th class="py-2 px-4 border-b">Tag Name</th>
                <th class="py-2 px-4 border-b">Text Content</th>
                <th class="py-2 px-4 border-b">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for tag in children_tags %}
            <tr>
                <td class="py-2 px-4 border-b">{{ tag.tag_name }}</td>
                <td class="py-2 px-4 border-b">{{ tag.text_content }}</td>
                <td class="py-2 px-4 border-b">
                    <a href="{% url 'view_all_children' template.id %}?tag_id={{ tag.id }}" class="text-blue-500 hover:text-blue-700 mr-2">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a href="{% url 'delete_tag' template.id %}?tag_id={{ tag.id }}" class="text-red-500 hover:text-red-700">
                        <i class="fas fa-trash"></i>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
