{% extends "homepage.html"%}
    {% load static %}
    {% block title %}Add New Template{%endblock%}
{% block content %}
    <div class="container mx-auto mt-5">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-3xl font-bold">Add New Template</h1>
            <a href="{% url 'template_list' %}" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
                <i class="fas fa-arrow-left"></i> Back to Templates
            </a>
        </div>
        <div class="bg-white shadow-md rounded p-6">
            <form action="{% url 'add_template' %}" method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Template Name:</label>
                    <input type="text" id="name" name="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mb-3" required><br>
                    <label for="template-category" class="block text-gray-700 text-sm font-bold mb-2">Choose a category:</label>
                    <select id="template-category" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline mb-3" name="category" required>
                        <option value="" disabled selected>Select a category</option>
                        {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                    <br><br>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                        <i class="fas fa-save"></i> Save Template
                    </button>
                </div>
            </form>
        </div>
    </div>

{%endblock%}
