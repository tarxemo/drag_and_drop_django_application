<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   _Tag_list
  </title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="container mx-auto" id="-1">
   <django_tag class="">
    {% for tag in tags %}
   </django_tag>
   <django_tag class="">
    {% endfor %}
   </django_tag>
   <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
     <tr class="">
      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
       Id
      </th>
      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
       Template
      </th>
      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
       Parent Tag
      </th>
      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
       Tag Name
      </th>
      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
       Text Content
      </th>
      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
       Django Tag Type
      </th>
      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
       Position
      </th>
      <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
       Actions
      </th>
     </tr>
    </thead>
    <tbody class="divide-y divide-gray-200 bg-white">
     <tr class="">
      <td class="px-6 text-gray-500 py-4 whitespace-nowrap text-sm">
       {{ tag.id }}
      </td>
      <td class="px-6 text-gray-500 py-4 whitespace-nowrap text-sm">
       {{ tag.template }}
      </td>
      <td class="px-6 text-gray-500 py-4 whitespace-nowrap text-sm">
       {{ tag.parent_tag }}
      </td>
      <td class="px-6 text-gray-500 py-4 whitespace-nowrap text-sm">
       {{ tag.tag_name }}
      </td>
      <td class="px-6 text-gray-500 py-4 whitespace-nowrap text-sm">
       {{ tag.text_content }}
      </td>
      <td class="px-6 text-gray-500 py-4 whitespace-nowrap text-sm">
       {{ tag.django_tag_type }}
      </td>
      <td class="px-6 text-gray-500 py-4 whitespace-nowrap text-sm">
       {{ tag.position }}
      </td>
      <td class="px-6 font-medium py-4 whitespace-nowrap text-sm">
       <a class="text-indigo-600 hover:text-indigo-900" href="/Tag/edit/{{ tag.id }}">
        Edit
       </a>
       <a class="text-red-600 hover:text-red-900" href="/Tag/delete/{{ tag.id }}">
        Delete
       </a>
      </td>
     </tr>
    </tbody>
   </table>
  </div>
 </body>
</html>
