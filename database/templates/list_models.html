{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-center text-[#091057] mb-6">Models List</h1>
    <div class="flex justify-center mb-6">
        <a href="{% url 'create_model' %}" class="bg-[#133E87] text-white py-2 px-4 rounded hover:bg-[#0a3c73] transition duration-300">
            Create New Model
        </a>
    </div>
    <ul class="bg-white shadow-lg rounded-lg divide-y divide-gray-200">
        {% for model in models %}
        <li class="flex justify-between items-center py-4 px-6 hover:bg-gray-100 transition duration-300">
            <span class="text-lg text-[#091057]">{{ model.model_name }}</span>
            <div class="space-x-2">
                <a href="{% url 'view_model' %}?model_name={{ model.model_name }}" class="text-[#133E87] hover:text-[#091057] transition duration-300">View</a>
                <a href="{% url 'edit_model' %}?model_name={{ model.model_name }}" class="text-[#133E87] hover:text-[#091057] transition duration-300">Edit</a>
                <form action="{% url 'delete_model' %}" method="POST" class="inline">
                    {% csrf_token %}
                    <input type="hidden" name="model_name" value="{{ model.model_name }}">
                    <button type="submit" class="text-red-500 hover:text-red-700 transition duration-300 focus:outline-none">
                        Delete
                    </button>
                </form>   
            </div>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
